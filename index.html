<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Pixel UFC Fighting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="ui-header">
            <div class="fighter-card p1">
                <div class="name">PLAYER 1 (A/D/W — Движение, J — Удар, K — Блок)</div>
                <div class="hp-bar-bg"><div id="p1-hp" class="hp-bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="timer" id="timer">99</div>
            <div class="fighter-card p2">
                <div class="name">PLAYER 2 (Стрелки — Движение, U/Num1 — Удар, I/Num2 — Блок)</div>
                <div class="hp-bar-bg"><div id="p2-hp" class="hp-bar-fill" style="width: 100%;"></div></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="game-over-screen" class="modal hidden">
            <h1 id="winner-text">ИГРОК 1 ПОБЕДИЛ!</h1>
            <p>Нажми Пробел или кнопку ниже для рестарта</p>
            <button onclick="resetGame()">Заново</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
