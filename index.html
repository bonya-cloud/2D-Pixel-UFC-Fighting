<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Pixel UFC Fighting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- кнопка настроек в правом верхнем углу -->
        <button id="settings-btn" class="settings-btn" title="Настройки">⚙️</button>

        <!-- модальное окно настроек -->
        <div id="settings-screen" class="modal hidden">
            <h2>Настройки</h2>

            <div class="settings-content">
                <!-- Настройка звука -->
                <div class="setting-item">
                    <span>Звуковые эффекты:</span>
                    <button id="sound-toggle-btn" class="toggle-btn">ВКЛ</button>
                </div>

                <!-- настройка скорости игры -->
                <div class="setting-item">
                    <span>Скорость боя:</span>
                    <button id="speed-toggle-btn" class="toggle-btn">1x (Норм)</button>
                </div>

                <!-- формат матча: один раунд или до 2 побед из 3 -->
                <div class="setting-item">
                    <span>Раунды:</span>
                    <button id="rounds-toggle-btn" class="toggle-btn">1 раунд</button>
                </div>

                <!-- НОВОЕ: игрок 2 может быть человеком или компьютером (ботом) -->
                <div class="setting-item">
                    <span>Игрок 2:</span>
                    <button id="cpu-toggle-btn" class="toggle-btn">Человек</button>
                </div>
            </div>

            <button id="close-settings-btn" class="close-btn">Сохранить и закрыть</button>
        </div>

        <div class="ui-header">
            <div class="fighter-card p1">
                <div class="portrait p1-portrait"></div>
                <div class="info-col">
                    <div class="name" id="p1-name">DUKE — A/D/W движение (2× = рывок), J удар, L пинок, K блок, S ульт</div>
                    <div class="hp-bar-bg"><div id="p1-hp" class="hp-bar-fill" style="width: 100%;"></div></div>
                    <!-- НОВОЕ: полоска ультимейта. Копится за удары, при 100% можно жать S -->
                    <div class="ult-bar-bg"><div id="p1-ult" class="ult-bar-fill" style="width: 0%;"></div></div>
                    <!-- НОВОЕ: полоска стамины. Тратится на рывок (двойной тап A/D) -->
                    <div class="stamina-bar-bg"><div id="p1-stamina" class="stamina-bar-fill" style="width: 100%;"></div></div>
                </div>
            </div>
            <div class="timer-col">
                <div class="timer" id="timer">99</div>
                <!-- сюда скриптом подставляется "РАУНД 2/3 • СЧЁТ 1:0", если выбран режим с несколькими раундами -->
                <div class="round-indicator" id="round-indicator"></div>
            </div>
            <div class="fighter-card p2">
                <div class="portrait p2-portrait"></div>
                <div class="info-col">
                    <div class="name" id="p2-name">RITA — Стрелки движение (2× = рывок), U удар, O пинок, I блок, ↓ ульт</div>
                    <div class="hp-bar-bg"><div id="p2-hp" class="hp-bar-fill" style="width: 100%;"></div></div>
                    <!-- НОВОЕ: полоска ультимейта у второго игрока -->
                    <div class="ult-bar-bg"><div id="p2-ult" class="ult-bar-fill" style="width: 0%;"></div></div>
                    <!-- НОВОЕ: полоска стамины у второго игрока -->
                    <div class="stamina-bar-bg"><div id="p2-stamina" class="stamina-bar-fill" style="width: 100%;"></div></div>
                </div>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="400" height="200"></canvas>

            <div id="game-over-screen" class="modal hidden">
                <h1 id="winner-text">ИГРОК 1<br>ПОБЕДИЛ!</h1>
                <p>Нажми Пробел или кнопку ниже, чтобы продолжить</p>
                <!-- текст кнопки и её действие (следующий раунд / полный рестарт матча) задаются в script.js -->
                <button id="continue-btn">Заново</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
